name: EAZyfoods CI
on:
  push:
    paths: ['eazyfoods/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['eazyfoods/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: eazyfoods

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/eazyfoods_test
      DATABASE_URL: postgresql://postgres:pw@localhost:5432/eazyfoods_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: eazyfoods/package-lock.json }
      - run: npm ci
      - run: PGPASSWORD=pw psql -h localhost -U postgres -c 'create database eazyfoods_test'
      - name: Typecheck
        run: npm run typecheck
      - name: API tests (real Postgres)
        run: npm test
      - name: Web build
        run: npm run build
      - name: Dependency vulnerabilities (high and above fail the build)
        run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: eazyfoods/package-lock.json }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: End-to-end journeys, responsive and accessibility checks
        run: npm run e2e
